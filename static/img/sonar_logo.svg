<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="logoBadgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="logoWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Símbolo da Marca (Ícone à Esquerda) -->
  <g transform="translate(4, 4)">
    <!-- Base Circular -->
    <circle cx="28" cy="28" r="26" fill="#0d0f15" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2"/>
    <!-- Arco de Radar Sonar Coral -->
    <path d="M 28 8 A 20 20 0 0 1 48 28" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" filter="url(#logoGlow)"/>
    <!-- Arco de Radar Sonar Ciano -->
    <path d="M 28 48 A 20 20 0 0 1 8 28" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" filter="url(#logoGlow)"/>
    
    <!-- Anel Pontilhado Interno -->
    <circle cx="28" cy="28" r="14" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Barras de Equalização de Áudio/Foley -->
    <rect x="18" y="24" width="2.5" height="8" rx="1.25" fill="#06b6d4"/>
    <rect x="23" y="19" width="2.5" height="18" rx="1.25" fill="#38bdf8"/>
    <rect x="28" y="15" width="2.8" height="26" rx="1.4" fill="url(#logoWaveGrad)"/>
    <rect x="33" y="20" width="2.5" height="16" rx="1.25" fill="#f43f5e"/>
    <rect x="38" y="25" width="2.5" height="6" rx="1.25" fill="#ec4899"/>
  </g>

  <!-- Tipografia Principal "SONAR" -->
  <text x="74" y="34" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" fill="url(#logoTextGrad)" letter-spacing="1.5">SONAR</text>

  <!-- Badge "LSE STUDIO" -->
  <g transform="translate(176, 17)">
    <rect x="0" y="0" width="86" height="20" rx="10" fill="rgba(244, 63, 94, 0.12)" stroke="url(#logoBadgeBorder)" stroke-width="1"/>
    <text x="43" y="14" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9.5" font-weight="700" fill="#f43f5e" text-anchor="middle" letter-spacing="0.8">LSE STUDIO</text>
  </g>

  <!-- Subtítulo Operacional Interno -->
  <text x="75" y="49" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.3">WORKSTATION INTERNA DE ACESSIBILIDADE</text>
</svg>
